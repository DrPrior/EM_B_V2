services:
  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      # Cap every transaction at 5s server-side as a DoS guard. Ingestion/
      # enrichment write one chunk per transaction, well under this budget.
      - NEO4J_db_transaction_timeout=5s
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - DB_URI=bolt://neo4j:7687
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHAT_MODEL=chat-model
      - EMBEDDING_MODEL=embedding-model
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./pipeline:/app/pipeline
      - ./project_data:/app/project_data
      - ./tests:/app/tests



  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-startup.sh:/ollama-startup.sh
      - ./Modelfile:/Modelfile
      - ./Modelfile.embeddings:/Modelfile.embeddings
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # `ollama list` succeeds as soon as the daemon is up — well before
      # ollama-startup.sh finishes pulling models. Gate on the custom variants
      # (created last by the startup script) so dependents only start once
      # embeddings/chat are actually usable. start_period covers the first-run
      # ~10GB model pull; on later runs the models are cached and this passes fast.
      test: ["CMD-SHELL", "ollama list | grep -q chat-model && ollama list | grep -q embedding-model"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
    entrypoint: ["/bin/sh", "/ollama-startup.sh"]
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    

volumes:
  neo4j_data:
    name: em_b_v2_neo4j_data
  ollama_data: