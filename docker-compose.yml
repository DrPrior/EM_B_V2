services:
  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      # Cap every transaction at 5s server-side as a DoS guard. Ingestion/
      # enrichment write one chunk per transaction, well under this budget.
      - NEO4J_db_transaction_timeout=5s
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  # Hybrid architecture: Ollama runs NATIVELY on the host (not in Docker) so it
  # can use the host GPU (Metal / CUDA / Vulkan). The API reaches the host
  # daemon over host.docker.internal and provisions its models on startup via
  # src/services/ollama_bootstrap.py. See docs/HYBRID_SETUP.md for the one-time
  # host setup (install Ollama, set OLLAMA_HOST=0.0.0.0).
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - DB_URI=bolt://neo4j:7687
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHAT_MODEL=chat-model
      - EMBEDDING_MODEL=embedding-model
    # Maps host.docker.internal to the host gateway. Docker Desktop (Win/Mac)
    # provides this name automatically; host-gateway makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./pipeline:/app/pipeline
      - ./project_data:/app/project_data
      - ./tests:/app/tests
      # Mounted so the startup bootstrap reads the live Modelfiles without a
      # rebuild (they are also COPYed into the image for prod builds).
      - ./Modelfile:/app/Modelfile
      - ./Modelfile.embeddings:/app/Modelfile.embeddings


volumes:
  neo4j_data:
    name: em_b_v2_neo4j_data