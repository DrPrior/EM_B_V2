<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EM Knowledge Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="h-screen flex flex-col bg-slate-50 overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-800 text-white px-6 py-3 flex items-center justify-between shrink-0 shadow-md">
    <span class="text-base font-semibold tracking-wide">EM Knowledge Assistant</span>
    <button id="new-chat-btn"
      class="text-sm bg-slate-600 hover:bg-slate-500 px-3 py-1.5 rounded-lg transition-colors">
      New Chat
    </button>
  </header>

  <!-- Body -->
  <div class="flex flex-1 min-h-0">

    <!-- Chat column -->
    <div class="flex flex-col flex-1 min-w-0">

      <!-- Message thread -->
      <div id="messages" class="flex-1 overflow-y-auto px-6 py-5 space-y-4">
        <div class="flex justify-start">
          <div class="assistant-bubble">
            Hello! I'm your Emergency Management Knowledge Assistant. Ask me about NIMS, ICS,
            FEMA doctrine, hazard mitigation planning, or any other emergency management topic.
          </div>
        </div>
      </div>

      <!-- Input bar -->
      <div class="border-t border-slate-200 bg-white px-6 py-4 shrink-0">
        <div class="flex gap-3 items-end">
          <textarea id="question-input" rows="1"
            placeholder="Ask a question… (Enter to send, Shift+Enter for newline)"
            class="flex-1 resize-none border border-slate-300 rounded-xl px-4 py-2.5 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   leading-relaxed bg-white"></textarea>
          <button id="send-btn"
            class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed
                   text-white rounded-xl px-5 py-2.5 text-sm font-medium transition-colors shrink-0">
            Send
          </button>
        </div>
      </div>

    </div>

    <!-- Sources sidebar -->
    <aside class="w-72 border-l border-slate-200 bg-white flex flex-col shrink-0">
      <div class="px-4 py-3 border-b border-slate-200 shrink-0">
        <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Sources</h2>
      </div>
      <div id="sources-list" class="flex-1 overflow-y-auto px-4 py-3 space-y-2">
        <p class="text-xs text-slate-400 italic">Sources will appear after your first question.</p>
      </div>
    </aside>

  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
